name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: PYTHONPATH=.:tests python -m unittest discover -s tests -v
